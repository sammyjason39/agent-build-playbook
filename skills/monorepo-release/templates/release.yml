name: Release (GitHub Packages)

# Manual publish of every workspace package to GitHub Packages under the repo owner's scope.
# Uses the workflow GITHUB_TOKEN (packages: write) — no personal token. Re-runs skip
# versions that already exist. Copy to .github/workflows/release.yml and set the env below.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and rewrite only (no registry)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22
  PUBLISH_SCOPE: <lower-case-owner>                  # e.g. my-org
  PUBLISH_INTERNAL_SCOPES: '@acme,@acme-modules'     # source scopes to rewrite
  PUBLISH_REPOSITORY: https://github.com/<Owner>/<repo>.git
  PUBLISH_EXCLUDE: '@acme-modules/_example'          # templates/apps that stay private

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tarball gate (no tests, no node_modules, every publishable package)
        run: |
          for dir in packages/*/ modules/*/; do
            node scripts/check-tarball.mjs "$dir" > /tmp/pack.log 2>&1 || { cat /tmp/pack.log; exit 1; }
          done
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-github.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
